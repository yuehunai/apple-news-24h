[project]
name = "apple-news-24h"
version = "1.47.0"
description = "Codex skill and standard-library crawler for recent 24-hour Apple software and hardware news briefs."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "YuehunAI" }
]
keywords = ["codex", "skill", "apple", "news", "rss"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Text Processing"
]

[project.urls]
Homepage = "https://github.com/yuehunai/apple-news-24h"
Issues = "https://github.com/yuehunai/apple-news-24h/issues"
